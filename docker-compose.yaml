name: xnat
services:
  xnat-web:
    # NOTE: Uncomment to test an already built image
    # image: ghcr.io/brown-bnc/xnat:1.10.1-batch-transfer
    build:
      context: .
    ports:
      - "8000:8000"
      - "8080:8080"
      - "8104:8104"
    env_file: .env
    volumes:
      # Enable plugins
      - ./config/ldap-provider.properties:/data/xnat/home/config/auth/ldap-provider.properties
      - ./config/oidc-provider.properties:/data/xnat/home/config/auth/oidc-provider.properties
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "localhost:8000/"]
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xnat -d xnat_test"]
