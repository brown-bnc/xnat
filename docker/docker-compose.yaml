name: xnat
services:
  xnat-web:
    build:
      context: ..
      dockerfile: Dockerfile
    # NOTE: Comment out the "build" section and uncomment "image" to test an already built image
    # image: ghcr.io/brown-bnc/xnat:1.10.1-batch-transfer
    ports:
      - "8000:8000"
      - "8080:8080"
      - "8104:8104"
    env_file: ./env/.env
    volumes:
      # Enable the LDAP plugin
      - ./config/ldap-provider.properties:/data/xnat/home/config/auth/ldap-provider.properties
      # Enable the OIDC plugin
      - ./config/oidc-provider.properties:/data/xnat/home/config/auth/oidc-provider.properties
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file: ./env/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
