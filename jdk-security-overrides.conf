# LDAP/LDAPS COMPATIBILITY (JDK 21) — jdk.tls.disabledAlgorithms override
#
# Our LDAP server is a legacy system that only supports the
# TLS_RSA_WITH_AES_256_CBC_SHA cipher suite over LDAPS. Starting with JDK 21,
# all static RSA key exchange cipher suites (TLS_RSA_*) are disabled by
# default via jdk.tls.disabledAlgorithms in java.security, which breaks the
# LDAPS handshake with that server.
#
# Rather than patching the base image's java.security file in place, this
# file is loaded as an ADDITIONAL security properties file via the JVM flag
# -Djava.security.properties=<this file> (see JAVA_TOOL_OPTIONS in the
# Dockerfile). Because security.overridePropertiesFile=true is the JDK
# default, any property set here replaces the matching property in the
# master java.security file; every other property (jdk.certpath.disabled
# Algorithms, protocol restrictions, etc.) is untouched.
#
# The value below is the tomcat:9-jdk21-temurin default
# jdk.tls.disabledAlgorithms list with ONLY the "TLS_RSA_*" entry removed.
# Nothing else was added, removed, or reordered.
#
# HOW TO CHECK FOR UPSTREAM UPDATES
#   Re-extract the current default from the base image we build FROM and
#   diff it against the value below (minus our TLS_RSA_* removal). Run this
#   whenever the base image tag in the Dockerfile changes (e.g. a new JDK
#   patch release), since the upstream default list can gain/lose entries:
#
#     docker run --rm tomcat:9-jdk21-temurin sh -c \
#       'grep -A6 "^jdk\.tls\.disabledAlgorithms=" \
#         "$JAVA_HOME/conf/security/java.security"'
#
#   If the upstream list changed, update the value below to match it (still
#   with TLS_RSA_* removed), so we keep picking up new hardening instead of
#   silently pinning to this JDK 21.0.11 snapshot.
jdk.tls.disabledAlgorithms=SSLv3, TLSv1, TLSv1.1, DTLSv1.0, RC4, DES, \
    MD5withRSA, DH keySize < 1024, EC keySize < 224, 3DES_EDE_CBC, anon, NULL, \
    ECDH, rsa_pkcs1_sha1 usage HandshakeSignature, \
    ecdsa_sha1 usage HandshakeSignature, dsa_sha1 usage HandshakeSignature
